services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hl
      POSTGRES_PASSWORD: hl
      POSTGRES_DB: hl
    # Host port is overridable because a locally-installed Postgres on 5432
    # silently wins the bind and produces confusing auth failures.
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hl']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['${REDIS_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
volumes:
  pgdata:
